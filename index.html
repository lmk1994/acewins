<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ACE 전교대 우승 원정대</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #09090B;
      overflow: hidden;
    }
    body {
      /* 아이폰 상단 노치·다이내믹 아일랜드 높이만큼 여백 확보 */
      padding-top: env(safe-area-inset-top);
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <!-- 기존에 넣으셨던 Apps Script 웹 앱 주소 그대로 유지 -->
  <iframe src="https://script.google.com/macros/s/AKfycbylrYIJVxJBU583ppGvxScB-Zk6d-1KisMC5YIvHsxZKmQy641oMlcYy13jB_yeoTff8w/exec"></iframe>
</body>
</html>
